# BMAD-S Ecosystem - Continuous Testing Framework
# Automated tests for entire ecosystem (Backend + Mobile + BMAD)

name: Ecosystem Tests

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]
  schedule:
    # Daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  # ==========================================
  # Backend Tests
  # ==========================================
  backend-tests:
    name: Backend Tests (Node.js)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hikeai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run linter
        working-directory: backend
        run: npm run lint || echo "Linter not configured yet"

      - name: Run unit tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/hikeai_test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

      - name: Check coverage threshold
        working-directory: backend
        run: |
          COVERAGE=$(node -e "const coverage = require('./coverage/coverage-summary.json'); console.log(coverage.total.lines.pct)")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 85" | bc -l) )); then
            echo "❌ Coverage below 85% threshold ($COVERAGE%)"
            exit 1
          fi
          echo "✅ Coverage above 85% threshold ($COVERAGE%)"

  # ==========================================
  # BMAD Core Tests
  # ==========================================
  bmad-tests:
    name: BMAD Core Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: bmad/package-lock.json

      - name: Install dependencies
        working-directory: bmad
        run: npm ci

      - name: Run unit tests
        working-directory: bmad
        run: npm test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: bmad/coverage/lcov.info
          flags: bmad
          name: bmad-coverage

      - name: Check coverage threshold (95%)
        working-directory: bmad
        run: |
          COVERAGE=$(node -e "const coverage = require('./coverage/coverage-summary.json'); console.log(coverage.total.lines.pct)")
          echo "BMAD Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 95" | bc -l) )); then
            echo "⚠️ BMAD coverage below 95% threshold ($COVERAGE%)"
            exit 1
          fi
          echo "✅ BMAD coverage excellent ($COVERAGE%)"

  # ==========================================
  # Mobile Tests (when implemented)
  # ==========================================
  mobile-tests:
    name: Mobile Tests (React Native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Run tests (if implemented)
        working-directory: mobile
        run: npm test || echo "Mobile tests not yet implemented"

  # ==========================================
  # Integration Tests
  # ==========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, bmad-tests]

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hikeai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start backend server
        working-directory: backend
        run: |
          npm start &
          sleep 10
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/hikeai_test
          PORT: 3000

      - name: Run integration tests
        working-directory: backend
        run: npm run test:integration || echo "Integration tests not yet configured"
        env:
          API_URL: http://localhost:3000

  # ==========================================
  # Security Scan
  # ==========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit (backend)
        working-directory: backend
        run: npm audit --audit-level=moderate

      - name: Run npm audit (bmad)
        working-directory: bmad
        run: npm audit --audit-level=moderate

      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

  # ==========================================
  # Performance Tests
  # ==========================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run load tests (Artillery)
        working-directory: backend
        run: |
          npm install -g artillery
          artillery quick --count 100 --num 10 http://localhost:3000/health || echo "Performance tests not configured"

  # ==========================================
  # Test Summary
  # ==========================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, bmad-tests, mobile-tests, integration-tests, security-scan]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "# 🧪 Ecosystem Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Tests: ${{ needs.backend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- BMAD Tests: ${{ needs.bmad-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Mobile Tests: ${{ needs.mobile-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Check if any tests failed
        if: needs.backend-tests.result == 'failure' || needs.bmad-tests.result == 'failure' || needs.integration-tests.result == 'failure'
        run: |
          echo "❌ Some tests failed!"
          exit 1

      - name: All tests passed
        if: needs.backend-tests.result == 'success' && needs.bmad-tests.result == 'success'
        run: |
          echo "✅ All critical tests passed!"
