# Autonomous Council - AI Agent Decision Making Workflow
name: autonomous-council
description: "Orchestrates autonomous multi-agent discussions where AI experts collaborate to make strategic decisions and produce specification documents without user intervention. Implements the 'Rada AI Agentů' vision from BMAD-S."
author: "BMad"

# Critical variables from config
config_source: "{project-root}/bmad/bmm/config.yaml"
project_name: "{config_source}:project_name"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"
user_skill_level: "{config_source}:user_skill_level"
date: system-generated

# Workflow components
installed_path: "{project-root}/bmad/bmm/workflows/autonomous-council"
instructions: "{installed_path}/instructions.md"

# Agent manifest and overrides
agent_manifest: "{project-root}/bmad/_cfg/agent-manifest.csv"
agent_overrides: "{project-root}/bmad/_cfg/agents/*.customize.yaml"

# Templates
decision_template: "{installed_path}/decision-template.md"
spec_template: "{installed_path}/spec-template.md"

# Output configuration
council_discussions_folder: "{output_folder}/council"
default_discussion_file: "{council_discussions_folder}/discussion-{date}.md"
default_spec_file: "{output_folder}/specs/spec-{topic-slug}-v1.md"

# Discussion parameters
max_rounds: 10
consensus_threshold: 0.75
min_participants: 3
max_participants: 5

# Exit conditions
exit_triggers:
  - "consensus_reached"
  - "max_rounds_exceeded"
  - "escalation_required"
  - "user_interrupt"

standalone: true
